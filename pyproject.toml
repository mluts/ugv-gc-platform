[project]
name = "uav-gc-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "pymavlink>=2.4.49",
    "pyright>=1.1.411",
    "pyserial>=3.5",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
stubPath = "typings"

[[tool.mypy.overrides]]
module = ["pymavlink", "pymavlink.*"]
ignore_missing_imports = true
