schema: spec-driven

context: |
  Tech stack: Python 3.13, FastAPI, pymavlink, pytest; dependencies managed with uv.
  Type checking: pyright at its default `basic` setting, over the production package
  `uav_gc` only — the test suite is excluded. Keep it clean: `make typecheck` must pass
  before committing.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Work one task at a time. After completing a task, STOP and report: files changed, what/why, tests run, and `make typecheck` passing. Wait for my explicit approval before starting the next task."
      - "Do not mark the next task in progress until I approve the previous task."
      - "After each task, commit the change with a message like 'feat(<area>): <task summary>' so I have a clean checkpoint to inspect or revert."
